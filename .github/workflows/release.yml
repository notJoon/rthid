name: Release

# Attaches prebuilt binaries to a GitHub release. Notes are written by hand when the
# release is published, and a manual run adds binaries to an existing release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross compiled on the arm64 runner.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Installs the toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p rthid --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          name="rthid-$TAG-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/rthid" README.md LICENSE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sha256" --clobber
