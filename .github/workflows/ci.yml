name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Covers the rthid binary on Linux and macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in mise.toml and exposes its tasks.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:rthid

  changes:
    # Decides whether the library jobs have anything new to test.
    runs-on: ubuntu-latest
    outputs:
      term: ${{ steps.filter.outputs.term }}
      widgets: ${{ steps.filter.outputs.widgets }}
      dither: ${{ steps.filter.outputs.dither }}
      io: ${{ steps.filter.outputs.io }}
      render: ${{ steps.filter.outputs.render }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Manifests, the toolchain and this workflow can change each crate's build too.
          # The shared list is declared once and reused through a YAML anchor.
          filters: |
            shared: &shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            dither:
              - *shared
              - 'crates/rthid-dither/**'
            render:
              - *shared
              - 'crates/rthid-render/**'
              - 'crates/rthid-dither/**'
            io:
              - *shared
              - 'crates/rthid-io/**'
            term:
              - *shared
              - 'crates/rthid-term/**'
            widgets:
              - *shared
              - 'crates/rthid-widgets/**'

  widgets:
    # Unit tests, doctests and rustdoc warnings for rthid-widgets, in parallel with check.
    # The crate is platform independent, so one runner is enough.
    # A skipped job counts as passing for required checks.
    needs: changes
    if: needs.changes.outputs.widgets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # rust-cache keys entries by job, so this cache is separate from the check job's.
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:widgets

  term:
    # Unit tests and rustdoc warnings for rthid-term, in parallel with check.
    # The crate is platform independent, so one runner is enough.
    # A skipped job counts as passing for required checks.
    needs: changes
    if: needs.changes.outputs.term == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # rust-cache keys entries by job, so this cache is separate from the check job's.
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:term

  dither:
    # Unit tests, golden tests and rustdoc warnings for rthid-dither.
    # Linux x86_64 and macOS arm64 keep the golden tests honest across platforms.
    # A skipped job counts as passing for required checks.
    needs: changes
    if: needs.changes.outputs.dither == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # rust-cache keys entries by job, so this cache is separate from the check job's.
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:dither

  io:
    # Unit tests, doctests and rustdoc warnings for rthid-io.
    # The crate has no platform sensitive goldens, so one runner is enough.
    needs: changes
    if: needs.changes.outputs.io == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:io

  render:
    # Unit tests, doctests and rustdoc warnings for rthid-render.
    # The crate has no platform sensitive goldens, so one runner is enough.
    needs: changes
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:render

  coverage:
    # Report only. Coverage does not depend on the OS, so one runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        # Explicit bash enables pipefail, so a failing coverage run is not masked by tee.
        shell: bash
        run: |
          mise run coverage | tee coverage.txt
          { echo '```text'; grep -E '^(Filename|TOTAL|\S+\.rs )' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
