name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux x86_64 and macOS arm64 keep the golden tests honest across platforms.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in mise.toml and exposes its tasks.
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:rthid

  widgets:
    # Unit tests, doctests and rustdoc warnings for rthid-widgets, in parallel with check.
    # The crate is platform independent, so one runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # rust-cache keys entries by job, so this cache is separate from the check job's.
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci:widgets

  coverage:
    # Report only. Coverage does not depend on the OS, so one runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        # Explicit bash enables pipefail, so a failing coverage run is not masked by tee.
        shell: bash
        run: |
          mise run coverage | tee coverage.txt
          { echo '```text'; grep -E '^(Filename|TOTAL|\S+\.rs )' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
