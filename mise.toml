[tools]
rust = { version = "1.100.0", components = "clippy,rustfmt,llvm-tools-preview" }
"github:taiki-e/cargo-llvm-cov" = "0.9.2"

[tasks.run]
run = "cargo run"

[tasks.test]
run = "cargo test --workspace"

[tasks.lint]
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings"]

# Prints line and region coverage per file. Add --html for a browsable report in target/llvm-cov/html.
[tasks.coverage]
# Skips the same timing sensitive test as ci:io.
run = "cargo llvm-cov --workspace --summary-only -- --skip atomic::tests::concurrent_updates_keep_every_line"

# CI runs each package in its own job so they finish in parallel.
[tasks."ci:rthid"]
run = [
  "cargo fmt -p rthid --check",
  "cargo clippy -p rthid --all-targets -- -D warnings",
  "cargo test -p rthid",
]

[tasks."ci:widgets"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo fmt -p rthid-widgets --check",
  "cargo clippy -p rthid-widgets --all-targets -- -D warnings",
  "cargo test -p rthid-widgets --lib",
  "cargo test -p rthid-widgets --doc",
  "cargo doc -p rthid-widgets --no-deps",
]

[tasks."ci:term"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo fmt -p rthid-term --check",
  "cargo clippy -p rthid-term --all-targets -- -D warnings",
  "cargo test -p rthid-term",
  "cargo doc -p rthid-term --no-deps",
]

[tasks."ci:dither"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo fmt -p rthid-dither --check",
  "cargo clippy -p rthid-dither --all-targets -- -D warnings",
  "cargo test -p rthid-dither",
  "cargo doc -p rthid-dither --no-deps",
]

[tasks."ci:io"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = [
  "cargo fmt -p rthid-io --check",
  "cargo clippy -p rthid-io --all-targets -- -D warnings",
  # Two writers with a short lock wait time out under parallel load on shared runners.
  "cargo test -p rthid-io -- --skip atomic::tests::concurrent_updates_keep_every_line",
  "cargo doc -p rthid-io --no-deps",
]
