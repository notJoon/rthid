[package]
name = "rthid"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["crates/rthid-render", "crates/rthid-dither", "crates/rthid-io", "crates/rthid-term", "crates/rthid-widgets"]

[workspace.dependencies]
divan = { package = "codspeed-divan-compat", version = "6.1.0" }
image = "0.25.10"
tempfile = "3.27.0"
libc = "0.2.191"
ratatui = "0.30.2"

[workspace.lints.rust]
missing_docs = "warn"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
image.workspace = true
ratatui.workspace = true
rthid-dither = { path = "crates/rthid-dither" }
rthid-render = { path = "crates/rthid-render" }
rthid-io = { path = "crates/rthid-io" }
rthid-term = { path = "crates/rthid-term" }
rthid-widgets = { path = "crates/rthid-widgets" }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

# Keep the dither loop responsive in dev builds
[profile.dev]
opt-level = 1

# Optimize dependencies in dev builds so image decoding stays fast
[profile.dev.package."*"]
opt-level = 3

# Keep symbols for samply and Instruments without disabling release optimizations.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

[dev-dependencies]
portable-pty = "0.9.0"
tempfile.workspace = true
vt100 = "0.18.1"

# The binary does not inherit workspace lints yet, so missing_docs applies to the library crates only.
[lints]
