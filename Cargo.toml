[package]
name = "rthid"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }

# Keep the dither loop responsive in dev builds
[profile.dev]
opt-level = 1

# Optimize dependencies in dev builds so image decoding stays fast
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
