[package]
name = "rthid"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/rthid-widgets"]

[workspace.dependencies]
ratatui = "0.30.2"

[workspace.lints.rust]
missing_docs = "warn"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
image = "0.25.10"
ratatui.workspace = true
rthid-widgets = { path = "crates/rthid-widgets" }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

# Keep the dither loop responsive in dev builds
[profile.dev]
opt-level = 1

# Optimize dependencies in dev builds so image decoding stays fast
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"

# The binary does not inherit workspace lints yet, so missing_docs applies only to rthid-widgets.
[lints]
